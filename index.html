              "outline-variant": "#d7c3ae",

              "on-secondary": "#ffffff",
              "on-tertiary-fixed-variant": "#004d66",

              tertiary: "#006687",
              "surface-container-high": "#eae7e7",
              "primary-fixed": "#ffddb5",
              "inverse-surface": "#303030",
              "on-surface": "#1b1c1c",

              "surface-dim": "#dcd9d9",
              "on-error-container": "#93000a",

              "on-primary": "#ffffff",
              "on-secondary-fixed": "#2b160f"

            borderRadius: {

    <style>
      body {
        font-family: 'Sarabun', 'Be Vietnam Pro', sans-serif;
        background-color: #fcf9f8;
        color: #1b1c1c;
        scroll-behavior: smooth;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      .thai-divider {
        background-image: linear-gradient(to right, transparent, rgba(131, 84, 0, 0.2), transparent);
        height: 1px;
        width: 100%;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        border: 1px solid #f0eded;
      }
      .lai-thai-divider {
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(131, 84, 0, 0.15), transparent);
        position: relative;
        margin: 2rem 0;
      }
      .lai-thai-divider::after {
        content: '⬥';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgba(131, 84, 0, 0.3);
        background: #fcf9f8;
        padding: 0 10px;
        font-size: 12px;
      }
      .committee-card:hover .hover-border {
        width: 100%;
      }
      .bento-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .bento-card:hover {
        transform: translateY(-4px);
      }
      .step-card:hover .step-number {
        transform: scale(1.1);
        background-color: #835400;
        color: white;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
